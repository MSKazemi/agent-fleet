name: release

# Publishes the sdist + wheel to PyPI with trusted publishing (OIDC) — no token is stored.
# Run it by hand from the Actions tab, naming the tag to publish; it builds from that tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.2.0)"
        required: true

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Check the version matches the tag
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${{ inputs.tag }}"
          ls dist
      - uses: pypa/gh-action-pypi-publish@release/v1
